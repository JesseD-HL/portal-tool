                <tbody>
                  {rows.map((r,i)=>(
                    <tr key={i} style={{ borderBottom:`1px solid ${C.border}`, background:i%2===0?C.card:"#162030" }}>
                      <td style={{ padding:"8px 12px", fontSize:11, fontWeight:600, color:r.type==="PPK"?C.blue:C.sub }}>{r.type}</td>
                       <td style={{ padding:"8px 12px", fontWeight:600 }}>{r.article}</td>
                       <td style={{ padding:"8px 12px", color:C.sub }}>{r.code}</td>
                       <td style={{ padding:"8px 12px" }}>{r.size || "—"}</td>
                       <td style={{ padding:"8px 12px" }}>{r.qty?.toLocaleString()}</td>
                       <td style={{ padding:"8px 12px", color:C.sub, fontSize:12 }}>{r.customer || "—"}</td>
                       <td style={{ padding:"8px 12px", color:C.sub, fontSize:12 }}>{r.segment || "—"}</td>
                       <td style={{ padding:"8px 12px", color:C.sub, fontSize:12 }}>{r.delivery || "—"}</td>
                       <td style={{ padding:"8px 12px", color:C.sub, fontSize:12 }}>{r.warehouse || "—"}</td>
                       <td style={{ padding:"8px 12px", color:C.sub, fontSize:12 }} title={r.seasonSrc==="header" ? "From the prebuy header" : "From the style number"}>{r.season || "—"}</td>
                       <td style={{ padding:"8px 12px", fontSize:11, color:r.inFile ? C.green : C.amber }}>{r.inFile ? "yes" : "no - not in SAP"}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    const fmtD = (d) => /^\d{8}$/.test(d||"") ? `${d.slice(0,4)}-${d.slice(4,6)}-${d.slice(6,8)}` : (d||"");
    const fmtN = (n, dp=2) => (n===null||n===undefined||n==="") ? "" : Number(n).toLocaleString(undefined, { maximumFractionDigits:dp });

    function PoCheckTab({ saved, setSaved }) {
      const [q, setQ]           = React.useState(saved?.q || "");
      const [res, setRes]       = React.useState(saved?.res || null);
      const [err, setErr]       = React.useState("");
      const [busy, setBusy]     = React.useState(false);
      const [margin, setMargin] = React.useState(null);
      const [onlyIssues, setOnlyIssues] = React.useState(false);
      const [open, setOpen]     = React.useState({});
      React.useEffect(() => { fetch(`${API}/margin`).then(r=>r.json()).then(setMargin).catch(()=>{}); }, []);
      React.useEffect(() => { setSaved({ q, res }); }, [q, res]);

      const lookup = async () => {
        if (!q.trim()) return;
        setBusy(true); setErr("");
        try {
          const r = await fetch(`${API}/lookup?q=${encodeURIComponent(q.trim())}`);
          const j = await r.json();
          if (!r.ok) throw new Error(j.error || "Lookup failed");
          setRes(j); setOpen({});
        } catch (e) { setErr(e.message); setRes(null); }
        setBusy(false);
      };
      const uploadMargin = async (file) => {
        if (!file) return;
        setErr(""); const form = new FormData(); form.append("file", file);
        try {
          const r = await fetch(`${API}/margin`, { method:"POST", body:form });
          const j = await r.json();
          if (!r.ok) throw new Error(j.error || "Margin file could not be read");
          setMargin(j); if (q.trim() && res) lookup();
        } catch (e) { setErr(e.message); }
      };
      const clearMargin = async () => { const j = await (await fetch(`${API}/margin/clear`, { method:"POST" })).json(); setMargin(j); if (q.trim() && res) lookup(); };

      const lvlColor = { error:C.red, warn:C.amber, info:C.sub };
      const worst = (it) => it.flags.some(f=>f.level==="error") ? "error" : it.flags.some(f=>f.level==="warn") ? "warn" : "ok";
      const items = (res?.items||[]).filter(it => !onlyIssues || worst(it)!=="ok");
      const cell = { padding:"8px 10px", fontSize:12, borderBottom:`1px solid ${C.border}`, verticalAlign:"top" };
      const kv = (k, v) => <div style={{ display:"flex", gap:8, fontSize:12, padding:"2px 0" }}><span style={{ color:C.sub, minWidth:150 }}>{k}</span><span style={{ color:C.text }}>{v===""||v===null||v===undefined ? <span style={{ color:C.red }}>(blank)</span> : v}</span></div>;

      return (
        <div style={{ padding:"4px 0" }}>
          <div style={{ display:"flex", gap:10, alignItems:"center", flexWrap:"wrap", marginBottom:12 }}>
            <input value={q} onChange={e=>setQ(e.target.value)} onKeyDown={e=>{ if (e.key==="Enter") lookup(); }} placeholder="PO or requisition number"
              style={{ background:C.card, color:C.text, border:`1px solid ${C.border}`, borderRadius:6, padding:"9px 12px", fontSize:14, width:240 }}/>
            <button onClick={lookup} disabled={busy||!q.trim()} style={{ background:C.blue, color:"#fff", border:"none", borderRadius:6, padding:"9px 18px", fontWeight:600, cursor:"pointer" }}>{busy ? "Pulling from SAP…" : "Pull from SAP"}</button>
            <label style={{ background:C.card, color:C.text, border:`1px solid ${C.border}`, borderRadius:6, padding:"9px 14px", fontSize:13, cursor:"pointer" }}>
              {margin?.loaded ? "Replace margin file" : "Drop in margin file"}
              <input type="file" accept=".xlsx,.xlsm" style={{ display:"none" }} onChange={e=>{ uploadMargin(e.target.files[0]); e.target.value=""; }}/>
            </label>
            {margin?.loaded && <button onClick={clearMargin} style={{ background:"transparent", color:C.sub, border:`1px solid ${C.border}`, borderRadius:6, padding:"9px 12px", cursor:"pointer" }}>Clear margin</button>}
          </div>
          <div style={{ fontSize:12, color:C.sub, marginBottom:12 }}>
            {margin?.loaded
              ? `Margin file: ${margin.filename||margin.sheet} · ${margin.rows} rows · ${margin.styles} styles · ${margin.with_req} rows have a REQ# · ${margin.with_po} rows have a PO# · ${Object.entries(margin.terms||{}).map(([t,n])=>`${t||"(no term)"} ${n}`).join(", ")}`
              : "No margin file loaded: only the SAP-side checks run (PO vs requisition, HTS, fiber, blanks)."}
          </div>
          {err && <div style={{ background:"#3B0000", color:"#FCA5A5", padding:"10px 14px", borderRadius:6, marginBottom:12, fontSize:13 }}>{err}</div>}
          {res && (
            <div>
              <div style={{ display:"flex", gap:16, alignItems:"center", flexWrap:"wrap", marginBottom:10, fontSize:13 }}>
                <span style={{ color:C.text, fontWeight:600 }}>{res.kind==="po" ? "PO" : "Requisition"} {res.number}</span>
                <span style={{ color:C.sub }}>POs: {res.pos.join(", ")||"none"} · Reqs: {res.reqs.join(", ")||"none"}</span>
                <span style={{ color:C.red }}>{res.summary.error} errors</span>
                <span style={{ color:C.amber }}>{res.summary.warn} warnings</span>
                <span style={{ color:C.green }}>{res.summary.clean} of {res.summary.items} lines clean</span>
                <label style={{ color:C.sub }}><input type="checkbox" checked={onlyIssues} onChange={e=>setOnlyIssues(e.target.checked)}/> only lines with issues</label>
              </div>
              {res.notes.map((n,i)=><div key={i} style={{ color:C.amber, fontSize:12, marginBottom:4 }}>{n}</div>)}
              <div style={{ color:C.sub, fontSize:12, marginBottom:8 }}>{res.margin_note}{res.margin_only?.length ? ` Styles in the margin rows but not on this ${res.kind==="po"?"PO":"requisition"}: ${res.margin_only.join(", ")}.` : ""}</div>
              <div style={{ overflowX:"auto", border:`1px solid ${C.border}`, borderRadius:8 }}>
                <table style={{ width:"100%", borderCollapse:"collapse", color:C.text }}>
                  <thead><tr style={{ background:C.panel, color:C.sub, fontSize:11, textAlign:"left" }}>
                    {["","PO / item","Req / item","Article","Req pc","PO pc","FOB","First sale","Base duty / Duty / US tariff","HTS","Req date","PO delivery","Ex-factory","Issues"].map(h=><th key={h} style={{ padding:"8px 10px", whiteSpace:"nowrap" }}>{h}</th>)}
                  </tr></thead>
                  <tbody>
                    {items.map((it, ix) => {
                      const k = `${it.po}-${it.po_item}-${it.req}-${it.req_item}-${ix}`, w = worst(it);
                      return (
                        <React.Fragment key={k}>
                          <tr onClick={()=>setOpen(o=>({ ...o, [k]:!o[k] }))} style={{ cursor:"pointer" }}>
                            <td style={{ ...cell, color:w==="error"?C.red:w==="warn"?C.amber:C.green, fontWeight:700 }}>{w==="error"?"✗":w==="warn"?"!":"✓"}</td>
                            <td style={cell}>{it.po ? `${it.po} / ${it.po_item}` : "-"}</td>
                            <td style={cell}>{it.req ? `${it.req} / ${it.req_item}` : "-"}</td>
                            <td style={cell}>{it.article}<div style={{ color:C.sub, fontSize:11 }}>{it.desc}</div></td>
                            <td style={cell}>{fmtN(it.req_qty_pc,0)}</td>
                            <td style={cell}>{fmtN(it.po_qty_pc,0)}{it.other_po_qty_pc ? <div style={{ color:C.amber, fontSize:11 }}>+{fmtN(it.other_po_qty_pc,0)} other POs</div> : null}</td>
                            <td style={cell}>{fmtN(it.fob_pc)}</td>
                            <td style={cell}>{fmtN(it.zfs1)}</td>
                            <td style={cell}>{[it.zcsr, it.zcst, it.ztrf].map(v=>v===null?"-":fmtN(v,2)+"%").join(" / ")}</td>
                            <td style={cell}>{it.hts_master}{it.hts_po && it.hts_po!==it.hts_master ? <div style={{ color:C.red }}>PO {it.hts_po}</div> : null}</td>
                            <td style={cell}>{fmtD(it.req_date)}</td>
                            <td style={cell}>{fmtD(it.po_delivery)}</td>
                            <td style={cell}>{fmtD(it.ex_factory)}</td>
                            <td style={cell}>{it.flags.filter(f=>f.level!=="info").length || ""}</td>
                          </tr>
                          {open[k] && (
                            <tr><td colSpan={14} style={{ ...cell, background:C.panel }}>
                              {it.flags.map((f,i)=><div key={i} style={{ color:lvlColor[f.level], fontSize:12, padding:"2px 0" }}>{f.level.toUpperCase()}: {f.msg}</div>)}
                              <div style={{ display:"flex", gap:40, flexWrap:"wrap", marginTop:8 }}>
                                <div>
                                  {kv("PO type", `${it.po_type} ${it.po_type_text}`)}
                                  {kv("Vendor / factory", `${it.vendor} / ${it.factory}`)}
                                  {kv("Storage PO / req", `${it.storage_po} / ${it.storage_req}`)}
                                  {kv("Unit / pc per pac", `${it.unit} / ${it.pc_per_pac ?? ""}`)}
                                  {kv("HTS article master", it.hts_master)}
                                  {kv("HTS on PO", it.hts_po)}
                                  {kv("Dispatch / trading ctry", `${it.dispatch} / ${it.trading}`)}
                                  {kv("Fiber (SAP)", it.fiber)}
                                  {it.set_components.length>0 && kv("Set components", it.set_components.map(c=>`${c.code||"(blank)"} ${c.desc} fob ${c.fob ?? ""} 1st ${c.first_sale ?? ""}`).join(" | "))}
                                </div>
                                <div>
                                  <div style={{ color:C.sub, fontSize:11, marginBottom:4 }}>DELIVERY SCHEDULE</div>
                                  {it.sched.length ? it.sched.map(s=><div key={s.line} style={{ fontSize:12 }}>line {s.line}: {fmtN(s.qty_pc,0)} pc · ex-factory {fmtD(s.ex_factory)} · ETD {fmtD(s.etd)} · ETA {fmtD(s.eta)} · delivery {fmtD(s.delivery)}</div>) : <div style={{ fontSize:12, color:C.amber }}>no schedule line</div>}
                                </div>
                                {it.margin?.rows>0 && (
                                  <div>
                                    <div style={{ color:C.sub, fontSize:11, marginBottom:4 }}>MARGIN FILE ({it.margin.rows} rows, sheet rows {it.margin.rows_at?.join(", ")})</div>
                                    {kv("FINAL PO FOB", it.margin.fob?.join(", "))}
                                    {kv("Term", it.margin.term?.join(", "))}
                                    {kv("First sale", it.margin.first_sale?.join(", "))}
                                    {kv("Duty rate", it.margin.duty_rate?.join(", "))}
                                    {kv("COO", it.margin.coo?.join(", "))}
                                    {kv("Fabrication", it.margin.fabrication?.join(" | "))}
                                    {it.margin.qty!==undefined && kv("Style qty", fmtN(it.margin.qty,0))}
                                  </div>
                                )}
                              </div>
                            </td></tr>
                          )}
                        </React.Fragment>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            </div>
          )}
          {!res && !err && <div style={{ textAlign:"center", padding:"60px 0", color:C.sub, fontSize:13 }}>Enter a PO or requisition number to pull both from SAP and compare them.</div>}
        </div>
      );
    }

    function HistoryTab() {
      return (
        <div style={{ textAlign:"center", padding:"80px 0", color:C.sub }}>
          <div style={{ fontSize:32, marginBottom:12 }}>🕒</div>
          <div style={{ fontSize:16, fontWeight:500, marginBottom:6 }}>History coming soon</div>
          <div style={{ fontSize:13 }}>Past validation runs will appear here</div>
        </div>
      );
    }

    function App() {
      const [tab, setTab]   = useState("PREBUY");
      const [data, setData] = useState(null);
      const [chk, setChk]   = useState(null);     // PO CHECK tab keeps its last lookup while you visit other tabs
      const [serverBuild, setServerBuild] = useState(undefined);   // undefined = still asking
      React.useEffect(() => {
        fetch(`${API}/health`).then(r=>r.json()).then(j=>setServerBuild(j.build || null)).catch(()=>setServerBuild("unreachable"));
      }, []);
      const buildMismatch = serverBuild !== undefined && serverBuild !== PAGE_BUILD;
      const nOS  = data?.summary?.total_os  || 0;
      const nPPK = data?.summary?.total_ppk || 0;

      return (
        <div style={{ minHeight:"100vh", background:C.bg }}>
          {/* Header */}
          <div style={{ background:C.panel, borderBottom:`1px solid ${C.border}`, padding:"14px 32px",
            display:"flex", alignItems:"center", justifyContent:"space-between" }}>
            <div>
              <div style={{ fontWeight:700, fontSize:16, color:C.text }}>
                {data?.filename
                  ? data.filename.replace(/\.[^.]+$/, '').replace(/_/g,' ')
                  : "Buysheet Portal"}
              </div>
              <div style={{ color:C.sub, fontSize:11, marginTop:1 }}>Your Company · Article Operations</div>
              <div style={{ fontSize:10, marginTop:2, color: buildMismatch ? "#F59E0B" : C.sub }}>
                page {PAGE_BUILD} · server {serverBuild===undefined ? "…" : serverBuild===null ? "OLD (no build stamp)" : serverBuild}
                {" · "}<a href={`${API}/diagnostics`} target="_blank" rel="noreferrer" style={{ color:C.blue }}>diagnostics</a>
              </div>
            </div>
            {data && (
              <div style={{ display:"flex", gap:8 }}>
                {[["TOTAL",nOS+nPPK,C.text],
                  ["PPK",nPPK,C.blue],
                  ["OS",nOS,C.sub]].map(([k,v,color])=>(
                  <div key={k} style={{ background:C.card, border:`1px solid ${C.border}`, borderRadius:6,
                    padding:"6px 14px", textAlign:"center" }}>
                    <div style={{ color:C.sub, fontSize:10, fontWeight:600 }}>{k}</div>
                    <div style={{ color, fontWeight:700, fontSize:16 }}>{v}</div>
                  </div>
                ))}
              </div>
            )}
          </div>

          {buildMismatch && (
            <div style={{ background:"#2D1B00", borderBottom:"1px solid #92400E", color:"#F59E0B", padding:"10px 32px", fontSize:13 }}>
              {serverBuild==="unreachable"
                ? "Cannot reach the server - is server.py running?"
                : `This page (${PAGE_BUILD}) and the server (${serverBuild===null ? "old build" : serverBuild}) are from different builds. Copy BOTH server.py and portal.html into SAP TOOLS, stop the server with Ctrl+C and start it again.`}
            </div>
          )}

          <div style={{ maxWidth:1400, margin:"0 auto", padding:"24px", display:"flex", gap:24 }}>

            {/* Permanent left sidebar — ROW COUNTS */}
            <div style={{ width:180, flexShrink:0 }}>
              <div style={{ background:C.card, border:`1px solid ${C.border}`, borderRadius:8, padding:"16px" }}>
                <div style={{ color:C.sub, fontSize:10, fontWeight:600, letterSpacing:1, marginBottom:12 }}>ROW COUNTS</div>
                {[
                  ["TOTAL",  nOS+nPPK],
                  ["PPK",    nPPK],
                  ["OS",     nOS],
                  ["ECOM",   0],
                ].map(([k,v])=>(
                  <div key={k} style={{ display:"flex", justifyContent:"space-between", alignItems:"center",
                    padding:"8px 0", borderBottom:`1px solid ${C.border}` }}>
                    <span style={{ color:C.sub, fontSize:13 }}>{k}</span>
                    <span style={{ fontWeight:700, fontSize:15 }}>{v}</span>
                  </div>
                ))}
              </div>
            </div>

            {/* Main content */}
            <div style={{ flex:1, minWidth:0 }}>
              <TabBar active={tab} onChange={setTab}/>
              {tab==="PREBUY"         && <BuysheetTab data={data} setData={setData}/>}
              {tab==="ARTICLE CREATE" && <ArticleCreateTab data={data}/>}
              {tab==="DELIVERY FLOW"  && <DeliveryFlowTab/>}
              {tab==="BUYSHEET DATA"  && <BuysheetDataTab data={data}/>}
              {tab==="REQS"           && <ReqsTab data={data}/>}
              {tab==="PO CHECK"       && <PoCheckTab saved={chk} setSaved={setChk}/>}

            </div>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
